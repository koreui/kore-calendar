name: CI

on:
  push:
    branches: [main]
  pull_request:

# En el monorepo, kore-ui llega por un path repository (../kore-ui). El CI lo
# quita y lo instala desde Packagist: prueba exactamente lo que recibe quien hace
# `composer require kore-ui/calendar`. Por eso el CI falla mientras la versión de
# kore-ui que exige composer.json no esté publicada (ver CHANGELOG).
jobs:
  php-tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        stability: ['prefer-stable']
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          # Las versiones mínimas que promete composer.json (kore-ui, Carbon,
          # php-rrule...): un `^` demasiado bajo solo se ve aquí.
          - php: '8.2'
            laravel: '12'
            stability: 'prefer-lowest'
    steps:
      - uses: actions/checkout@v5

      - name: Use kore-ui from Packagist, not the monorepo path
        run: composer config --unset repositories

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, bcmath
          coverage: none
          ini-values: memory_limit=-1

      - name: Install Composer dependencies (Laravel ${{ matrix.laravel }})
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --with "illuminate/support:^${{ matrix.laravel }}.0"

      - name: Run Pest
        run: ./vendor/bin/pest

  js-tests:
    name: JS (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

      # ANTES del build a propósito: después, el dist siempre está fresco.
      - name: Check dist/ is in sync with sources
        run: npm run dist:check

      - name: Build assets
        run: npm run build

      - name: Verify committed dist/ matches the build
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/kore-calendar.js no coincide con el build de resources/js/."
            echo "Ejecuta 'npm run build' y commitea dist/kore-calendar.js."
            git diff --stat -- dist/
            exit 1
          fi

      - name: Check bundle size
        run: npm run size
